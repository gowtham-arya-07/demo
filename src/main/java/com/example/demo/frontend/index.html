<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cricket Scoreboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>🏏 Cricket Scoreboard</h1>

    <div class="score">

        <span id="runs">0</span> /
        <span id="wickets">0</span>

    </div>

    <div class="overs">

        Overs:
        <span id="overs">0.0</span>

    </div>

    <div class="buttons">

        <button onclick="addRuns(1)">1 Run</button>

        <button onclick="addRuns(4)">4 Runs</button>

        <button onclick="addRuns(6)">6 Runs</button>

        <button onclick="addWicket()">
            Wicket
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
